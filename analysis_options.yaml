include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Node dependencies, not Dart source. `firebase-tools` 15 vendors Dart
    # *templates* for `firebase init functions`, which do not compile on their own
    # — 7 errors, all fatal under --fatal-infos, in files nobody in this repo
    # wrote. CI cannot catch this: the rules job and the analyze job run on
    # separate runners, so no runner ever has both node_modules and the analyzer.
    - "test_rules/node_modules/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_plugin_registrant.dart"
    - "lib/firebase_options.dart"
    # Generated by `flutter gen-l10n` on every `pub get`.
    - "lib/src/l10n/generated/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Generated Drift code is analyzed by its own package; keep our signal clean.
    invalid_annotation_target: ignore

linter:
  rules:
    # A template ships as a starting point, not a published package. Requiring a
    # doc comment on every public member adds noise that downstream forks delete.
    public_member_api_docs: false
    lines_longer_than_80_chars: false

    # Cannot be satisfied: Dart forbids named parameters starting with `_`, so a
    # private field fed by a named argument always trips this.
    prefer_initializing_formals: false

    # Repositories deliberately catch everything in order to normalise unknown
    # failures into the app's own exception types. That is the boundary's job.
    avoid_catches_without_on_clauses: false

    # Analytics and other telemetry are fire-and-forget by design; awaiting them
    # would make user-facing actions wait on a network round-trip.
    discarded_futures: false

    # `controller.set(true)` reads better than `set(enabled: true)`.
    avoid_positional_boolean_parameters: false

    # Riverpod 3 keeps its provider types (`ProviderFamily`, `Override`, …) in a
    # separate `misc.dart` export. Annotating every provider declaration would
    # mean importing that barrel everywhere purely to satisfy this rule.
    specify_nonobvious_property_types: false

    # Dependencies here are grouped by role with explanatory comments, which is
    # more useful in a template than one flat alphabetical list.
    sort_pub_dependencies: false
