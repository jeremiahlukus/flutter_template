name: flutter_template
description: "A robust, reusable Flutter template: Firebase auth + storage, Drift, go_router, analytics, and an 85% coverage gate."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  # --- Firebase --------------------------------------------------------------
  cloud_firestore: ^6.8.0
  firebase_analytics: ^12.4.6
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_storage: ^13.4.6
  # Drop-in sign-in / sign-up / password-reset screens.
  firebase_ui_auth: ^3.1.0

  # --- Local storage ---------------------------------------------------------
  drift: ^2.34.3
  # Supplies the platform sqlite3 binaries and the default connection.
  drift_flutter: ^0.3.1
  path: ^1.9.1
  path_provider: ^2.1.6

  # --- App plumbing ----------------------------------------------------------
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  intl: ^0.20.2
  logger: ^2.7.0
  connectivity_plus: ^7.3.1
  firebase_crashlytics: ^5.2.7
  package_info_plus: ^10.2.1
  dio: ^5.11.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  url_launcher: ^6.3.2
  firebase_messaging: ^16.5.0

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.0
  # In-memory Firestore; the whole notes/sync suite runs on this.
  fake_cloud_firestore: ^4.2.0
  # In-memory FirebaseAuth; lets auth tests run with no Firebase project.
  firebase_auth_mocks: ^0.15.2
  firebase_core_platform_interface: ^8.1.0
  # QA-only: registers the VM Service extensions the `flutter-skill` on-device
  # flows drive. A dev_dependency on purpose, so `lib/` cannot import it and it
  # never reaches a release build. Entrypoint: tool/main_dev.dart.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_skill: ^0.9.36
  flutter_test:
    sdk: flutter
  mock_exceptions: ^0.8.2
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  # Runs `gen-l10n` on every `pub get` / `run`, so AppLocalizations is always in
  # step with the ARB files in lib/src/l10n/arb.
  generate: true

# App icons. Regenerate with: dart run flutter_launcher_icons
#
# The source is a single 1024x1024 PNG with no transparency and no rounded
# corners — every platform applies its own mask, and baking one in produces a
# double-rounded icon.
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#3D5AFE"
  macos:
    generate: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/icon_foreground.png

# Native splash screen. Regenerate with: dart run flutter_native_splash:create
#
# Colours track AppTheme's seed; keep them in step by hand, since a Dart
# constant cannot be read from YAML.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  image: assets/branding/splash.png
  image_dark: assets/branding/splash_dark.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#121212"
    image: assets/branding/splash.png
    image_dark: assets/branding/splash_dark.png
  android: true
  ios: true
  web: false
